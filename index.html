<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f9;color:#101d35}
header{background:#101d35;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
nav a{color:white;text-decoration:none;margin-left:20px;font-size:13px}
.hero{background:#101d35;color:white;padding:75px 7%;min-height:330px}
.hero small{color:#b8c6d9;letter-spacing:3px}
.hero h1{font-size:48px;margin:18px 0}
.hero p{color:#cbd5e1;margin-bottom:25px}
.btn{background:white;color:#101d35;padding:13px 23px;text-decoration:none;font-weight:bold;display:inline-block}
section{padding:45px 6%}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.heading h2{font-size:25px}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.category{background:#dfe5ed;padding:30px 20px;font-weight:bold;font-size:20px;text-align:center}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product{background:white;padding:12px;border:1px solid #e5e9ef}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e8edf3}
.product h3{font-size:14px;margin:12px 0}
.product p{font-size:12px;color:#64748b}
.product a{display:block;text-align:center;background:#101d35;color:white;padding:11px;margin-top:12px;text-decoration:none;font-size:12px}
footer{background:#101d35;color:white;text-align:center;padding:30px;font-size:13px}
@media(max-width:600px){nav a{margin-left:8px;font-size:11px}.hero h1{font-size:36px}.products{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
